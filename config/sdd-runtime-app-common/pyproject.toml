[project]
name = "autohub-sdd-runtime-app-common"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["devkit-spec", "devkit-agt", "devkit-advisory", "app-tools"]

[tool.uv]
package = false
# app-tools pins its development toolchain; this isolated profile reviews the newer runtime together.
override-dependencies = [
    "devkit-dist @ git+https://github.com/mjkimR/devkit@3609efe87e590c8da5f01a905cb207a13090f943#subdirectory=packages/devkit-dist",
    "devkit-agt @ git+https://github.com/mjkimR/devkit@3609efe87e590c8da5f01a905cb207a13090f943#subdirectory=packages/devkit",
    "devkit-advisory @ git+https://github.com/mjkimR/devkit@3609efe87e590c8da5f01a905cb207a13090f943#subdirectory=packages/devkit-advisory",
]

[tool.uv.sources]
devkit-spec = { git = "https://github.com/mjkimR/devkit", subdirectory = "packages/devkit-spec", rev = "3609efe87e590c8da5f01a905cb207a13090f943" }
devkit-agt = { git = "https://github.com/mjkimR/devkit", subdirectory = "packages/devkit", rev = "3609efe87e590c8da5f01a905cb207a13090f943" }
devkit-advisory = { git = "https://github.com/mjkimR/devkit", subdirectory = "packages/devkit-advisory", rev = "3609efe87e590c8da5f01a905cb207a13090f943" }
app-tools = { git = "https://github.com/mjkimR/app-common.git", subdirectory = "tools/app-tools", rev = "3c3232b17ccc6e231615532e24643afa6b88a78b" }
