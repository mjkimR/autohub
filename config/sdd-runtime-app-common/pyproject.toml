[project]
name = "autohub-sdd-runtime-app-common"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["devkit-spec", "devkit-agt", "devkit-advisory", "app-tools"]

[tool.uv]
package = false
# app-tools pins its development toolchain; this isolated profile reviews the newer runtime together.
override-dependencies = [
    "devkit-dist @ git+https://github.com/mjkimR/devkit@96f34f89b689bf73a5cf225224d93583249c3bf3#subdirectory=packages/devkit-dist",
    "devkit-agt @ git+https://github.com/mjkimR/devkit@96f34f89b689bf73a5cf225224d93583249c3bf3#subdirectory=packages/devkit",
    "devkit-advisory @ git+https://github.com/mjkimR/devkit@96f34f89b689bf73a5cf225224d93583249c3bf3#subdirectory=packages/devkit-advisory",
]

[tool.uv.sources]
devkit-spec = { git = "https://github.com/mjkimR/devkit", subdirectory = "packages/devkit-spec", rev = "96f34f89b689bf73a5cf225224d93583249c3bf3" }
devkit-agt = { git = "https://github.com/mjkimR/devkit", subdirectory = "packages/devkit", rev = "96f34f89b689bf73a5cf225224d93583249c3bf3" }
devkit-advisory = { git = "https://github.com/mjkimR/devkit", subdirectory = "packages/devkit-advisory", rev = "96f34f89b689bf73a5cf225224d93583249c3bf3" }
app-tools = { git = "https://github.com/mjkimR/app-common.git", subdirectory = "tools/app-tools", rev = "96fb2fa7116813cf7e71538943a45ca20ccb7232" }
