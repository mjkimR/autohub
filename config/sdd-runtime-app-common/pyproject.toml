[project]
name = "autohub-sdd-runtime-app-common"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["devkit-spec", "devkit-agt", "devkit-advisory", "app-tools"]

[tool.uv]
package = false
# app-tools pins its development toolchain; this isolated profile reviews the newer runtime together.
override-dependencies = [
    "devkit-dist @ git+https://github.com/mjkimR/devkit@a1ffedafd49ccd4bb6298bacacca1c25c0cf48ef#subdirectory=packages/devkit-dist",
    "devkit-agt @ git+https://github.com/mjkimR/devkit@a1ffedafd49ccd4bb6298bacacca1c25c0cf48ef#subdirectory=packages/devkit",
    "devkit-advisory @ git+https://github.com/mjkimR/devkit@a1ffedafd49ccd4bb6298bacacca1c25c0cf48ef#subdirectory=packages/devkit-advisory",
]

[tool.uv.sources]
devkit-spec = { git = "https://github.com/mjkimR/devkit", subdirectory = "packages/devkit-spec", rev = "a1ffedafd49ccd4bb6298bacacca1c25c0cf48ef" }
devkit-agt = { git = "https://github.com/mjkimR/devkit", subdirectory = "packages/devkit", rev = "a1ffedafd49ccd4bb6298bacacca1c25c0cf48ef" }
devkit-advisory = { git = "https://github.com/mjkimR/devkit", subdirectory = "packages/devkit-advisory", rev = "a1ffedafd49ccd4bb6298bacacca1c25c0cf48ef" }
app-tools = { git = "https://github.com/mjkimR/app-common.git", subdirectory = "tools/app-tools", rev = "2837f847231f442e6dcd9de7b89c962bc59866a0" }
