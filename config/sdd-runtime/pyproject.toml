[project]
name = "autohub-sdd-runtime"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["devkit-spec", "devkit-agt", "devkit-advisory"]

[tool.uv]
package = false
# devkit-spec sources devkit-agt from devkit main; pin that transitive URL to the reviewed commit.
override-dependencies = [
    "devkit-agt @ git+https://github.com/mjkimR/devkit.git@ecff1223284a37c8c00174f92ccf06d68291dcf2#subdirectory=packages/devkit",
]

[tool.uv.sources]
devkit-spec = { git = "https://github.com/mjkimR/devkit-spec", rev = "f7b8b9ca844c9dcc260d303f0b1032701479d4fa" }
devkit-agt = { git = "https://github.com/mjkimR/devkit.git", subdirectory = "packages/devkit", rev = "ecff1223284a37c8c00174f92ccf06d68291dcf2" }
devkit-advisory = { git = "https://github.com/mjkimR/devkit.git", subdirectory = "packages/devkit-advisory", rev = "ecff1223284a37c8c00174f92ccf06d68291dcf2" }
