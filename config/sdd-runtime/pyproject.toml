[project]
name = "autohub-sdd-runtime"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["devkit-spec", "devkit-agt", "devkit-advisory"]

[tool.uv]
package = false
# devkit-spec sources devkit-agt from devkit main; pin that transitive URL to the reviewed commit.
override-dependencies = [
    "devkit-agt @ git+https://github.com/mjkimR/devkit.git@d592cb30acae9dc2913ce39e005602fb2a4e0c6a#subdirectory=packages/devkit",
]

[tool.uv.sources]
devkit-spec = { git = "https://github.com/mjkimR/devkit-spec", rev = "77923e2402a065be2dd7abd30a46fd677b426d29" }
devkit-agt = { git = "https://github.com/mjkimR/devkit.git", subdirectory = "packages/devkit", rev = "d592cb30acae9dc2913ce39e005602fb2a4e0c6a" }
devkit-advisory = { git = "https://github.com/mjkimR/devkit.git", subdirectory = "packages/devkit-advisory", rev = "d592cb30acae9dc2913ce39e005602fb2a4e0c6a" }
