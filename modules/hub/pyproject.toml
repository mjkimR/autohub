[project]
name = "scheduler-mgr"
version = "0.1.0"
description = "Scheduler Manager"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.3",
    "app-layer-base",
    "app-mcp",
    "app-http-client",
    "app-prebuilt-auth",
    "psycopg[binary]>=3.1",
    "cachetools>=7.0.0",
    "croniter>=6.0.0",
    "dotenv>=0.9.9",
    "fastapi>=0.128.2",
    "google-api-python-client>=2.198.0",
    "google-auth>=2.55.2",
    "google-cloud-secret-manager>=2.24.0",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "orjson>=3.11.7",
    "pydantic-settings>=2.12.0",
    "sqlalchemy>=2.0.46",
    "uvicorn",
    "python-multipart>=0.0.9",
]

[tool.uv.sources]
app-mcp = { git = "https://github.com/mjkimR/app-common.git", subdirectory = "packages/transports/app-mcp", rev = "125f8f7e849a52af89b022b3700f274bb34bc7e6" }
app-prebuilt-auth = { git = "https://github.com/mjkimR/app-common.git", subdirectory = "packages/prebuilt/app-prebuilt-auth", rev = "125f8f7e849a52af89b022b3700f274bb34bc7e6" }
app-http-client = { git = "https://github.com/mjkimR/app-common.git", subdirectory = "packages/adapters/app-http-client", rev = "125f8f7e849a52af89b022b3700f274bb34bc7e6" }
app-layer-base = { git = "https://github.com/mjkimR/app-common.git", subdirectory = "packages/base/app-layer-base", rev = "125f8f7e849a52af89b022b3700f274bb34bc7e6" }
app-error = { git = "https://github.com/mjkimR/app-common.git", subdirectory = "packages/base/app-error", rev = "125f8f7e849a52af89b022b3700f274bb34bc7e6" }
app-testing-base = { git = "https://github.com/mjkimR/app-common.git", subdirectory = "packages/base/app-testing-base", rev = "125f8f7e849a52af89b022b3700f274bb34bc7e6" }
app-tools = { git = "https://github.com/mjkimR/app-common.git", subdirectory = "tools/app-tools", rev = "125f8f7e849a52af89b022b3700f274bb34bc7e6" }

[dependency-groups]
dev = [
    "aiosqlite",
    "app-testing-base",
    "app-tools",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.15.0",
    "testcontainers[postgres]>=4.14.2",
]

[tool.pytest.ini_options]
log_level = "INFO"
pythonpath = "."
testpaths = "tests"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "e2e: mark tests as end-to-end tests",
    "integration: real database and in-process API tests",
    "unit: mark tests as unit tests",
    "real_commit: use TRUNCATE strategy instead of savepoint rollback (allows real commits)",
]

[tool.pyright]
venvPath = "../../"
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "basic"
extraPaths = ["."]
