version = 1
revision = 3
requires-python = "==3.13.*"

[manifest]
members = [
    "member",
    "ws-root",
]

[[package]]
name = "devkit-spec"
version = "0.0.1"
source = { editable = "packages/devkit-spec" }

[[package]]
name = "member"
version = "0.0.1"
source = { editable = "packages/member" }

[[package]]
name = "ws-root"
version = "0.1.0"
source = { virtual = "." }

[package.dev-dependencies]
dev = [
    { name = "devkit-spec" },
    { name = "member" },
]

[package.metadata]

[package.metadata.requires-dev]
dev = [
    { name = "devkit-spec", editable = "packages/devkit-spec" },
    { name = "member", editable = "packages/member" },
]
