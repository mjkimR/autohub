findings:
- issue: Cold install cannot fit the existing outer timeouts and a cancelled build loops on cold instances
  evidence: modules/hub/app/features/project_management/sdd/services.py:131 (65 s), activities.py:71 (90 s), plan_decisions.py:95 (90 s), milestone_graph.py:10 (150 s); proposal D5
  failure_condition: First readiness/inspect after deploy or scale-out spends its budget on clone and build; the outer timeout cancels and discards the install and every later tick repeats it
  suggested_action: 'Decouple installation from request budgets: single-flight background install, retryable preparing diagnostic, no cancellation by caller deadline; measure cold-install time and size'
  resolution: resolved
  severity: P1
- issue: 'Decision needed: install phase runs repository build-backend code with network egress and a server-wide credential'
  evidence: Consumer lock git sources have no wheels (PEP 517 builds); isolation.py:51 --unshare-all; CAP-SDD-runtime-isolation rule 11
  failure_condition: A build backend can read the credential, reach other private sources or the Cloud Run metadata server for the Hub service-account token, beyond the accepted lock-trust decision
  suggested_action: Decide whether trust extends to build-time code with egress; otherwise fetch sources in the Hub process with the project connector token and build offline with pinned backends
  resolution: open
  severity: P1
- issue: git-safe commands and activity start now depend on a lock-derived devkit runtime
  evidence: checkout.py:80-86 resolves runtime_home/runtime_pin for git-safe; activities.py:72-93; checkout.py:164 selects runtime before fetch
  failure_condition: Plain Git operations are blocked by a cold install or a base lock defect; runtime cannot be known before fetch
  suggested_action: Make git-safe independent of the devkit venv; resolve the runtime after fetch per evaluated commit
  resolution: resolved
  severity: P2
- issue: Which commit's lock defines identity on each evaluation path is unspecified
  evidence: policy.py:61 and activities.py:72 (base); services.py:132 and plan_decisions.py:96 (head); milestones.py:56,96 and batch_evidence.py:54,102 (ref); bridge.py:84 (operator checkout)
  failure_condition: Merging main that bumps devkit refuses the run though no agent touched devkit; admission and enrollment can use different runtimes
  suggested_action: Add a per-path table and decide whether runtime version belongs in the rule 9 refusal given configuration_digest already covers the receipt
  resolution: open
  severity: P2
- issue: Receipt-driven install set misses preset-selected bundles on the RECEIPT_STALE path
  evidence: runtime.py:136-147 (presets plus receipt); proposal D2 and D7
  failure_condition: Committed presets ahead of the receipt leave the new bundle's package uninstalled, so the kept stale-regeneration path fails in its intended case
  suggested_action: Derive the install set from the locked dependency group that declares devkit, or define the mismatch as a repository defect
  resolution: resolved
  severity: P2
- issue: Hand-rendered lock closure with --no-deps is underspecified and identity omits build inputs
  evidence: uv.lock markers, extras, resolution-markers, git source fragments and wheel hashes; proposal D1-D3
  failure_condition: Forked or marker-gated locks yield incomplete closures; instances may install different artifacts under one identity
  suggested_action: Let uv render the set inside the sandbox (frozen sync/export of a group) and hash that rendered output plus interpreter
  resolution: resolved
  severity: P2
- issue: Per-instance cache concurrency and LRU eviction are unsafe across worker processes and in-use venvs
  evidence: docker/hub.Dockerfile WORKERS=3; isolation.py binds home for the whole evaluation; proposal D5
  failure_condition: Duplicate builds across processes and rename collisions; eviction deletes a venv a running evaluation uses
  suggested_action: Cross-process file lock per digest, existing target counts as success, lease-protected or idle-only eviction
  resolution: resolved
  severity: P2
