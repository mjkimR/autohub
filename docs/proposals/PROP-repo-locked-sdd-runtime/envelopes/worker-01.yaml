questions:
- id: q-a
  title: Runtime identity change mid-run
  prompt: When a later head of an admitted run resolves a different runtime identity, should Hub refuse continuation or continue with the new runtime?
  context: The runtime now comes from the repository lock, so a devkit bump or a base merge changes it mid-run. Continuing keeps the effective workflow, policy and configuration digest refusals that already detect contract changes; refusing forces re-enrollment.
  options:
  - id: continue
    description: Continue with the new runtime; workflow, policy and configuration digests keep their refusal
    recommended: true
  - id: refuse
    description: Keep rule 9's refusal and require re-enrollment on any runtime identity change
    recommended: false
  allow_note: true
- id: q-b
  title: Install trust for private Git sources
  prompt: How should the install phase fetch private Git sources and run build backends?
  context: devkit and g-tools ship no wheels, so installing them runs build-backend code. A network-enabled sandbox with a shared token exposes that token and the Cloud Run metadata server to build code and needs the token granted on every new private source.
  options:
  - id: hub-fetch-offline-build
    description: Hub fetches Git sources with the project's connector token; the sandbox builds without network or credentials, registry downloads only
    recommended: true
  - id: sandbox-network-token
    description: The sandbox installs with network egress and a dedicated read-only source token
    recommended: false
  allow_note: true
- id: q-c
  title: Repositories without a devkit lock
  prompt: Keep a default image runtime as fallback for repositories whose root lock lacks devkit-spec, or refuse them?
  context: Removing every server profile simplifies identity; no known consumer relies on a lockless setup (the canary repository is not an SDD consumer).
  options:
  - id: refuse
    description: Refuse with a repository diagnostic; one runtime source only
    recommended: true
  - id: fallback
    description: Keep the default image runtime as an explicit fallback for lockless repositories
    recommended: false
  allow_note: true
