  evidence: proposal.md:70 uses one registration UUID with 27-character stem; existing source keys may share that prefix.
  failure_condition: Distinct valid long local slots truncate to one generated key and break the remapped graph.
  suggested_action: Add a deterministic per-slot ordinal to the bounded request-derived key; test shared long prefixes and edges.
  resolution: resolved
  severity: P2
