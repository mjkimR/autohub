[project]
name = "autohub-sdk"
version = "0.1.0"
description = "Pipeline declarations and manifest export for Auto Hub consumers"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["pydantic>=2.12,<3"]

[dependency-groups]
dev = ["pytest>=9.0.2", "ruff>=0.15.0"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autohub_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
venvPath = "../.."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "basic"
include = ["src", "examples", "tests"]
