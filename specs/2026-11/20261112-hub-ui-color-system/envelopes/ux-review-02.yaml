  failure_condition: Operators who pause runs deliberately see amber for work they chose to hold
  suggested_action: 'Accepted as designed: resuming always needs the operator; record the rationale, no change'
  resolution: waived
  waiver: 'Accepted as designed: resuming a paused run always needs the operator, and no API field distinguishes an intended pause; recorded in spec.md section 6 and docs/steering/visual-style.md'
