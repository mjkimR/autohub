  failure_condition: A locked Git source whose build hook plants a .pth or symlink in the staging .venv and removes the uv interpreter cache
  suggested_action: Confine the build sandbox to the source tree and wheel output; run the final wheel install inside the sandbox; reject symlinked build outputs; test a planted .pth
  resolution: open
  severity: P1
- issue: pin.json python_prefix comes from repository-controlled inventory output and widens every later devkit sandbox's readable paths
  evidence: runtime_install.py:232; checkout.py:87; isolation.py:62-65; probe test_pin_trusts_repository_controlled_python_prefix
  failure_condition: A locked package whose .pth prints inventory JSON with python_prefix '/'
  suggested_action: Compute python_prefix in the Hub process; validate inventory types; add a unit test
  resolution: open
  severity: P1
- issue: Registry packages from a non-default index pass classification because uv export emits no index option
  evidence: lock_runtime.py:138-205; probe .cache/review-probe/review-01/index
