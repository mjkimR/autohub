[tool.uv.workspace]
members = ["modules/hub"]

[tool.rye.workspace]
members = ["modules/hub"]

[tool.ruff]
exclude = [".git", ".venv", "migrations", "node_modules"]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["F403", "E402"]
"__init__.py" = ["F403"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "basic"
extraPaths = ["./modules/hub"]

[dependency-groups]
dev = [
    "pyright>=1.1.409",
]

[tool.app-tools]
check-arch = true
