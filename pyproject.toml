[tool.uv.sources]
devkit-agt = { git = "https://github.com/mjkimR/devkit", subdirectory = "packages/devkit", rev = "0c82c55c21f0768941a9d7656f310d7b52c9c69f" }
devkit-advisory = { git = "https://github.com/mjkimR/devkit", subdirectory = "packages/devkit-advisory", rev = "0c82c55c21f0768941a9d7656f310d7b52c9c69f" }

[tool.uv.workspace]
members = ["modules/hub", "packages/sdk"]

[tool.rye.workspace]
members = ["modules/hub", "packages/sdk"]

[tool.ruff]
exclude = [".agents", ".claude", ".codex", ".devkit", ".git", ".venv", "migrations", "node_modules"]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["F403", "E402"]
"__init__.py" = ["F403"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "basic"
extraPaths = ["./modules/hub"]

[dependency-groups]
dev = [
    "devkit-agt",
    "devkit-advisory",
    "pyright>=1.1.409",
]
