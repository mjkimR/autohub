[tool.uv]
# Review the app-common toolchain against the same immutable devkit release commit.
override-dependencies = [
    "devkit-agt @ git+https://github.com/mjkimR/devkit@a1ffedafd49ccd4bb6298bacacca1c25c0cf48ef#subdirectory=packages/devkit",
    "devkit-dist @ git+https://github.com/mjkimR/devkit@a1ffedafd49ccd4bb6298bacacca1c25c0cf48ef#subdirectory=packages/devkit-dist",
    "devkit-advisory @ git+https://github.com/mjkimR/devkit@a1ffedafd49ccd4bb6298bacacca1c25c0cf48ef#subdirectory=packages/devkit-advisory",
]

[tool.uv.sources]
devkit-dist = { git = "https://github.com/mjkimR/devkit", subdirectory = "packages/devkit-dist", rev = "a1ffedafd49ccd4bb6298bacacca1c25c0cf48ef" }
devkit-agt = { git = "https://github.com/mjkimR/devkit", subdirectory = "packages/devkit", rev = "a1ffedafd49ccd4bb6298bacacca1c25c0cf48ef" }
devkit-advisory = { git = "https://github.com/mjkimR/devkit", subdirectory = "packages/devkit-advisory", rev = "a1ffedafd49ccd4bb6298bacacca1c25c0cf48ef" }
devkit-spec = { git = "https://github.com/mjkimR/devkit", subdirectory = "packages/devkit-spec", rev = "a1ffedafd49ccd4bb6298bacacca1c25c0cf48ef" }
devkit-catalog = { git = "https://github.com/mjkimR/devkit", subdirectory = "packages/devkit-catalog", rev = "a1ffedafd49ccd4bb6298bacacca1c25c0cf48ef" }

[tool.uv.workspace]
members = ["modules/hub", "packages/sdk"]

[tool.rye.workspace]
members = ["modules/hub", "packages/sdk"]

[tool.ruff]
exclude = [".agents", ".claude", ".codex", ".devkit", ".git", ".venv", "migrations", "node_modules"]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["F403", "E402"]
"__init__.py" = ["F403"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "basic"
extraPaths = ["./modules/hub"]

[dependency-groups]
dev = [
    "devkit-spec",
    "devkit-catalog",
    "devkit-advisory",
    "pyright>=1.1.409",
]
